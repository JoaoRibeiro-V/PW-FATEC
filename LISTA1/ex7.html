<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercicio 7</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>Dia</legend>

            <div>
                <input type="checkbox" id="domingo" nome="domingo">
                <label for="domingo">Domingo</label>
            </div>

            <div>
                <input type="checkbox" id="segunda" nome="segunda" checked>
                <label for="segunda">Segunda-feira</label>
            </div>

            <div>
                <input type="checkbox" id="terca" nome="terca">
                <label for="terca">Terça-feira</label>
            </div>

            <div>
                <input type="checkbox" id="quarta" nome="quarta">
                <label for="quarta">Quarta-feira</label>
            </div>

            <div>
                <input type="checkbox" id="quinta" nome="quinta" checked>
                <label for="quinta">Quinta-feira</label>
            </div>

            <div>
                <input type="checkbox" id="sexta" nome="sexta">
                <label for="sexta">Sexta-feira</label>
            </div>

            <div>
                <input type="checkbox" id="sabado" nome="sabado">
                <label for="sabado">Sábado</label>
            </div>

            <br>
            <button type="submit">Enviar</button>
        </fieldset>
    </form>
</body>

</html>
